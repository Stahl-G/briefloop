[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "briefloop-local"
version = "0.17.1"
description = "Local multi-runtime agent workbench for sourced briefings, independent review and skill learning"
requires-python = ">=3.11"
dependencies = ["pydantic>=2,<3", "markdown-it-py>=3,<5", "wikiskill-research==0.1.1+briefloop.2", "python-docx>=1", "pypdf>=5", "Pillow>=11", "pypdfium2>=4,<6", "openpyxl>=3.1,<4"]

[project.optional-dependencies]
docx = ["python-docx>=1"]
dev = ["pytest>=8"]

[project.scripts]
briefloop = "briefloop.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
briefloop = ["static/*", "skill_assets/*/*.md"]
