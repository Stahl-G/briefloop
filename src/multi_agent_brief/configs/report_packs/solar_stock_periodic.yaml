schema_version: briefloop.report_pack.v1
pack_id: solar_stock_periodic
report_type: solar_stock_periodic
display_name: Solar Stock Periodic
status: experimental
description: Capital-markets weekly. Packaged default watchlist is global solar peers; the core issuer ticker is a required --core-ticker input at workspace creation. Missing non-core names are coverage disclosures, not delivery blockers.
default_policy_profile: solar_stock_default
default_report_spec:
  schema_version: briefloop.report_spec.v1
  report_pack: solar_stock_periodic
  policy_profile: solar_stock_default
  report_type: solar_stock_periodic
  title: Capital Markets Weekly
  cadence: weekly
  audience: {label: management and capital-markets reader, language: zh-CN}
  source_policy: {mode: runtime_handoff, hidden_autonomous_crawling: false}
  control_spine: {claim_ledger: true, artifact_registry: true, quality_gates: true, event_log: true, archive: true, source_appendix: true, support_records: true, human_delivery_approval: true, frozen_artifact_integrity: true}
  outputs: [markdown, docx]
  metadata:
    product_layer: report_pack_registry
    boundary: experimental_contract_only
    use_case: solar_stock_periodic_report
    benchmark_ticker: TAN
    primary_tickers: [TE, FSLR, CSIQ, JKS, NXT, DQ]
    overseas_tickers: [009830.KS, WAAREEENER.NS, PREMIERENE.NS, VIKRAMSOLR.NS]
    event_only_entities: [Qcells, Illuminate USA, ES Foundry, Suniva, Talon PV]
    required_section_intents: [executive_summary, primary_equity_comparison, overseas_equity_comparison, event_price_timeline, earnings_valuation, policy_input_dashboard, capacity_asset_watch, sentiment_monitor, core_implications]
    non_claims: [no_investment_advice, no_causal_price_attribution_without_evidence, no_search_snippet_evidence, no_release_authority]
