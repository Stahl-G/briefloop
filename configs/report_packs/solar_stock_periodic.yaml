      - WAAREEENER.NS
      - PREMIERENE.NS
      - VIKRAMSOLR.NS
    event_only_entities:
      - Qcells
      - Illuminate USA
      - ES Foundry
      - Suniva
      - Talon PV
    required_section_intents:
      - executive_summary
      - primary_equity_comparison
      - overseas_equity_comparison
      - event_price_timeline
      - earnings_valuation
      - policy_input_dashboard
