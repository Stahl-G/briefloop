<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline';"><title>BriefLoop</title><style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#222b26;background:#faf9f6}body{margin:0;display:grid;place-items:center;min-height:100vh}main{width:min(600px,calc(100vw - 96px));padding:48px}small{color:#087745;letter-spacing:.15em;font-weight:700}h1{font-size:38px;margin:20px 0}h2{font-size:18px;margin-top:0}p{color:#667068;line-height:1.8}button{font:inherit;font-weight:600;border:1px solid #d7dfd6;border-radius:9px;background:white;padding:14px 22px;margin:10px 8px 0 0;cursor:pointer}button.primary{background:#087745;color:white;border-color:#087745}button:disabled{opacity:.55;cursor:wait}#status,#environment-status{white-space:pre-wrap;overflow-wrap:anywhere}#status{min-height:2em}#recent{max-width:580px;text-align:left;overflow-wrap:anywhere}#setup{background:white;border:1px solid #d7dfd6;border-radius:14px;padding:24px;margin:24px 0}progress{width:100%;accent-color:#087745}footer{margin-top:32px;font-size:13px;color:#7c847d}[hidden]{display:none!important}
</style></head><body><main><small>BRIEFLOOP · 桌面版</small><h1>打开你的工作区</h1><p>在本机整理材料、研究和写作。报告与对话保存在你选择的文件夹，重开后可以接着工作。</p>
<section id="setup" aria-labelledby="setup-title"><h2 id="setup-title">准备运行环境</h2><p>BriefLoop 使用本机 Python 3.11 或更高版本。首次准备会联网下载依赖到 App 专属环境，需要额外下载量和磁盘空间；实际用量取决于 Python 版本及平台。</p><p role="status" id="environment-status">正在检测运行环境…</p><progress id="environment-progress" aria-label="正在准备运行环境"></progress><button class="primary" id="prepare" hidden>下载依赖并准备</button><button id="python-help" hidden>安装 Python</button><button id="inspect" hidden>重新检测</button><button id="cancel-setup" hidden>取消准备</button></section>
<div id="workspace-actions"><button class="primary" id="create" disabled>新建工作区</button><button id="open" disabled>打开工作区</button><button id="recent" hidden disabled></button></div><p role="status" id="status"></p><footer>工作区独立于应用保存。升级或移除应用不会删除报告。</footer></main><script src="welcome.js"></script></body></html>
